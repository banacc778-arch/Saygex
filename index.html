<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện ôn tập Địa lí – Trắc nghiệm & Đúng/Sai</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--tx:#1f2328;--mut:#6b7280;--pri:#9a3412;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--bd:#e5e1d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--card:#221f17;--tx:#f1ede4;--mut:#a39e90;--pri:#fb923c;--ok:#4ade80;--okb:#14532d;--no:#f87171;--nob:#7f1d1d;--bd:#3a3528}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;color:var(--pri);margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.q{font-weight:bold;margin-bottom:8px}
.tag{font-size:.75rem;color:var(--mut);font-weight:normal}
label{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label:hover{border-color:var(--pri)}
label.ok{background:var(--okb);border-color:var(--ok)}
label.no{background:var(--nob);border-color:var(--no)}
.tf{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)}
.tf .st{flex:1}.tf .bt{display:flex;gap:6px}
.tf label{margin:0;padding:6px 12px}
.pas{font-style:italic;color:var(--mut);border-left:3px solid var(--pri);padding-left:10px;margin-bottom:8px}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-size:1.0rem;cursor:pointer;font-family:inherit}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.res{font-size:1.3rem;text-align:center}
.exp{font-size:.85rem;margin-top:6px;color:var(--ok)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.home{text-align:center;max-width:380px;margin:12vh auto 0;padding:28px 20px}.home h2{color:var(--pri);margin:0 0 8px}.prog{color:var(--mut);font-size:.85rem;margin-bottom:6px}.fb{margin-top:12px;font-weight:bold}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.header-info{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.85rem;margin-bottom:6px}
.timer{font-weight:bold;color:var(--pri);background:var(--bd);padding:2px 8px;border-radius:6px}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
// Tổng hợp 20 câu trắc nghiệm nhiều lựa chọn

["Nguyên nhân chính sinh ra hiện tượng các mùa trong năm trên Trái Đất là do:","Trái Đất tự quay quanh trục có độ nghiêng lớn.","Trái Đất chuyển động quanh Mặt Trời với trục nghiêng không đổi phương.","Khoảng cách giữa Trái Đất và Mặt Trời thay đổi liên tục trong năm.","Tốc độ chuyển động của Trái Đất quanh Mặt Trời thay đổi theo mùa.",1],

["Nhân tố nào sau đây quyết định trực tiếp đến lượng mưa trên Trái Đất?","Khí áp và các loại gió thường xuyên.","Sự xuất hiện của các dòng biển nóng và lạnh.","Độ cao địa hình so với mực nước biển.","Góc chiếu của tia sáng mặt trời lúc giữa trưa.",0],
["Khu vực nào trên Trái Đất thường có lượng mưa lớn nhất quanh năm?","Khu vực chí tuyến bắc và nam.","Vùng ôn đới lục địa.","Vùng xích đạo ẩm ướt.","Vùng cực giá lạnh.",2]

// Tổng hợp các câu hỏi Đúng/Sai
const TF=[

 [["Nội lực là những lực phát sinh từ bên ngoài bề mặt Trái Đất.",0],

  ["Nội lực làm cho bề mặt Trái Đất ngày càng gồ ghề, tạo ra các lục địa, núi cao và vực sâu.",1],

  ["Phong hóa là quá trình phá hủy đá và khoáng sản do tác động của nội lực.",0]]],
["Về chuyển động tự quay quanh trục của Trái Đất:",
 [["Trái Đất quay quanh trục theo hướng từ Đông sang Tây.",0],
  ["Thời gian Trái Đất quay một vòng quanh trục là khoảng 24 giờ (1 ngày đêm).",1],
  ["Chuyển động tự quay quanh trục tạo ra hiện tượng ngày và đêm luân phiên nhau trên toàn cầu.",1],
  ["Ở bán cầu Bắc, lực Cô-ri-ô-lít làm vật thể chuyển động bị lệch về phía bên trái.",0]]],

 [["Trái Đất chuyển động quanh Mặt Trời theo quỹ đạo hình tròn tuyệt đối.",0],
  ["Trục Trái Đất nghiêng và không đổi phương khi chuyển động quanh Mặt Trời.",1],
  ["Chuyển động này cùng với trục nghiêng là nguyên nhân sinh ra các mùa trong năm.",1],

["Về các mảng kiến tạo:",
 [["Thạch quyển được cấu tạo bởi các mảng kiến tạo lớn và nhỏ dịch chuyển trên tầng man-ti trên.",1],
  ["Có tất cả 7 mảng kiến tạo lớn cấu tạo nên vỏ Trái Đất.",1],
  ["Mảng Thái Bình Dương là mảng kiến tạo lớn nằm hoàn toàn ở bán cầu Nam.",0],
  ["Nơi hai mảng kiến tạo xô vào nhau hoặc tách rời nhau thường là vùng ổn định nhất, ít xảy ra thiên tai.",0]]],
["Về động đất và núi lửa:",
 [["Động đất là hiện tượng rung chuyển đột ngột lớp vỏ Trái Đất từ sâu trong lòng đất.",1],

  ["Động đất và núi lửa thường xảy ra ở các vùng ranh giới tiếp xúc của các mảng kiến tạo.",1],
  ["Con người hiện nay đã có thể dự báo chính xác tuyệt đối thời gian và địa điểm xảy ra động đất trước vài tuần.",0]]],

 [["Khí áp là sức nặng của không khí ép xuống bề mặt Trái Đất.",1],

const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const app=document.getElementById('app');

let test=[], idx=0, score=0, q;
let timerInterval=null, secondsPassed=0;

// Hệ thống quản lý danh sách câu hỏi đã làm đúng để ẩn đi
let masterList = [];
let correctIds = new Set();
try {
  correctIds = new Set(JSON.parse(localStorage.getItem('geo_correct_v2') || '[]'));
} catch(e){}

function saveCorrect() {
  try { localStorage.setItem('geo_correct_v2', JSON.stringify([...correctIds])); } catch(e){}
}

function initMasterList() {
  masterList = [];
  MC.forEach((m, i) => masterList.push({type: 'mc', id: 'mc_'+i, data: m}));
  TF.forEach((t, i) => masterList.push({type: 'tf', id: 'tf_'+i, data: t}));
}

function formatTime(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => n.toString().padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function startTimer() {
  stopTimer();
  secondsPassed = 0;
  timerInterval = setInterval(() => {
    secondsPassed++;
    const timerEl = document.getElementById('timer-display');
    if (timerEl) timerEl.textContent = formatTime(secondsPassed);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function home(){
  stopTimer();
  let totalQ = MC.length + TF.length;
  let remaining = totalQ - correctIds.size;
  app.innerHTML=`<div class="card home">
    <h2>🌍 Luyện ôn tập Địa lí</h2>
    <p style="color:var(--mut)">Bộ đề chia nhỏ (10 câu/phiên)<br>Các câu trả lời đúng sẽ được ẩn đi cho đến khi hết kho.</p>
    <p class="tag" style="margin-bottom:14px">Đã hoàn thành: <b>${correctIds.size}/${totalQ}</b> câu</p>
    <div class="bar" style="justify-content:center; flex-direction:column; gap:8px">
      <button onclick="start(false)">Làm phiên 10 câu (${remaining} câu chưa thuộc)</button>
      <button class="sec" onclick="start(true)">Làm lại từ đầu (Reset toàn bộ)</button>
    </div>
  </div>`;
}

function start(reset=false){
  if(reset) {
    correctIds.clear();
    saveCorrect();
  }
  initMasterList();

  // Lọc ra những câu chưa làm đúng
  let available = masterList.filter(item => !correctIds.has(item.id));
  
  // Nếu đã làm hết kho, reset lại tự động để bắt đầu vòng mới
  if(available.length === 0) {
    correctIds.clear();
    saveCorrect();
    available = masterList;
  }

  // Lấy ngẫu nhiên tối đa 10 câu cho mỗi lượt làm ngắn gọn
  available = sh(available);
  let selected = available.slice(0, 10);

  test = selected.map(item => {
    if(item.type === 'mc') {
      const m = item.data;
      return {
        k: 'mc', id: item.id,
        key: m[0], q: m[0],
        o: sh([0,1,2,3].map(i=>({t: m[i+1], ok: i === m[5]})))
      };
    } else {
      const t = item.data;
      return {
        k: 'tf', id: item.id,
        key: t[0], p: t[0],
        s: sh(t[1])
      };
    }
  });

  idx = 0; score = 0; 
  startTimer();
  show();
}

function show(){
  q = test[idx]; q.failed = false;
  let h = `<div class="header-info"><span class="prog">Câu ${idx+1}/${test.length}</span><span class="timer">⏱ <span id="timer-display">${formatTime(secondsPassed)}</span></span></div><div class="card">`;
  if(q.k==='mc'){
    h += `<div class="q">${q.q}</div>` + q.o.map((o,i)=>`<label><input type="radio" name="a" value="${i}"> ${'ABCD'[i]}. ${o.t}</label>`).join('');
  }else{
    h += `<div class="q">${q.key} <span class="tag">(Xác định Đúng/Sai cho từng ý)</span></div><div class="pas">${q.p}</div>` +
    q.s.map((s,i)=>`<div class="tf"><div class="st">${'abcd'[i]}) ${s[0]}</div><div class="bt"><label><input type="radio" name="t${i}" value="1"> Đúng</label><label><input type="radio" name="t${i}" value="0"> Sai</label></div></div>`).join('');
  }
  h += `<div id="fb" class="fb"></div><div class="bar" id="act"><button onclick="check()">Kiểm tra</button></div></div>`;
  app.innerHTML = h; window.scrollTo(0,0);
}

function lock(v){document.querySelectorAll('input').forEach(i=>i.disabled=v)}

function check(){
  let ok, miss=false;
  if(q.k==='mc'){
    const v = document.querySelector('input[name=a]:checked');
    if(!v) miss=true; else ok = q.o[+v.value].ok;
  }else{
    ok = true;
    q.s.forEach((s,i)=>{
      const v = document.querySelector(`input[name=t${i}]:checked`);
      if(!v) miss=true; 
      else if(+v.value !== s[1]) ok=false;
    });
  }
  const fb = document.getElementById('fb'), act = document.getElementById('act');
  if(miss){ fb.className='fb no'; fb.textContent='Hãy chọn đáp án đầy đủ trước khi kiểm tra.'; return; }
  lock(true);
  const last = idx === test.length-1;
  
  if(ok){
    if(!q.failed){
      score++;
      correctIds.add(q.id); // Ẩn câu đúng ở các lần sau
      saveCorrect();
    }
    fb.className='fb ok'; fb.textContent='✔ Chính xác!';
    act.innerHTML=`<button onclick="next()">${last?'Xem kết quả':'Câu tiếp theo'}</button>`;
  }else{
    q.failed = true;
    fb.className='fb no'; fb.textContent='✘ Chưa đúng.';
    act.innerHTML=`<button onclick="retry()">Thử lại</button><button class="sec" onclick="next()">Bỏ qua</button>`;
  }
}

function retry(){
  lock(false); document.querySelectorAll('input').forEach(i=>i.checked=false);
  document.getElementById('fb').textContent='';
  document.getElementById('act').innerHTML='<button onclick="check()">Kiểm tra</button>';
}

function next(){
  idx++;
  if(idx < test.length) return show();
  stopTimer();
  app.innerHTML=`<div class="card home">
    <h2>Hoàn thành phiên 10 câu!</h2>
    <p class="res">Đúng ngay lần đầu: <b>${score}/${test.length}</b></p>
    <p style="text-align:center;color:var(--pri);font-weight:bold;margin:8px 0">⏱ Thời gian: ${formatTime(secondsPassed)}</p>
    <p class="tag" style="margin-bottom:14px">Các câu đúng đã được tự động ẩn khỏi các lượt ôn tập tiếp theo.</p>
    <div class="bar" style="justify-content:center; flex-direction:column; gap:8px">
      <button onclick="start(false)">Làm tiếp 10 câu nữa</button>
      <button class="sec" onclick="home()">Về trang chủ</button>
    </div>
  </div>`;
}

home();
</script>
</body>
 </html>
